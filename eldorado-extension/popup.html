<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Services - Eldorado Vouch Poster</title>
  <style>
    body {
      width: 360px;
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
    }
    h2 {
      color: #FF6B35;
      font-size: 16px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .btn-primary { background: #FF6B35; color: #fff; }
    .btn-secondary { background: #333; color: #e0e0e0; }
    .btn-danger { background: #ED4245; color: #fff; }
    #status {
      font-size: 12px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #1a1a2e;
      min-height: 20px;
    }
    .hint { font-size: 11px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>🐲 Eldorado Vouch Poster</h2>
  <p style="font-size:12px;color:#888;margin:0 0 12px;">Posts a consolidated vouch summary (total vouches, rating %, latest 5 vouches) to Discord.</p>

  <label>Discord Webhook URL</label>
  <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." />
  <div class="hint">Create a webhook in your Discord channel settings → Integrations → Webhooks.</div>

  <button class="btn-primary" id="saveBtn">Save Webhook</button>
  <button class="btn-secondary" id="postBtn">Post Vouch Summary Now</button>
  <button class="btn-danger" id="resetBtn">Reset "Already Posted" Flag</button>

  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
